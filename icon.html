<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kuji">
    <link rel="apple-touch-icon" href="./icon.png">
    
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Kuji%22,%22short_name%22:%22Kuji%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23F2F2F7%22,%22theme_color%22:%22%23BF5AF2%22,%22icons%22:[{%22src%22:%22./icon.png%22,%22sizes%22:%22192x192%22,%22type%22:%22image/png%22},{%22src%22:%22./icon.png%22,%22sizes%22:%22512x512%22,%22type%22:%22image/png%22}]}">

    <title>Kuji - 萬能抽獎</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary-color: #BF5AF2;
            --bg-color: rgba(191, 90, 242, 0.12);
            --cell-bg-color: rgba(255, 255, 255, 0.85);
            --text-color: #000000;
            --border-color: rgba(0, 0, 0, 0.1);
            --safe-area-top: env(safe-area-inset-top, 0px);
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
            user-select: none;
            touch-action: manipulation;
        }

        .app-container { height: 100vh; display: flex; flex-direction: column; padding-top: var(--safe-area-top); padding-bottom: var(--safe-area-bottom); }
        .view { display: none; flex: 1; flex-direction: column; overflow-y: auto; padding: 16px; }
        .view.active { display: flex; }

        .ios-navbar { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: var(--primary-color); color: white; flex-shrink: 0; }
        .ios-navbar h1 { font-size: 17px; font-weight: 700; }

        .ios-list { margin-bottom: 24px; border-radius: 14px; overflow: hidden; background: var(--cell-bg-color); backdrop-filter: blur(10px); }
        .ios-cell { padding: 14px 16px; border-bottom: 0.5px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
        .ios-cell:last-child { border-bottom: none; }
        .ios-cell.clickable:active { background: rgba(0,0,0,0.05); }

        .ios-input { width: 100%; padding: 14px; font-size: 17px; background: var(--cell-bg-color); border-radius: 12px; margin-bottom: 16px; border: none; outline: none; }
        .ios-btn-primary { background: var(--primary-color); color: white; font-size: 17px; font-weight: 700; padding: 16px; border-radius: 16px; text-align: center; width: 100%; box-shadow: 0 4px 12px rgba(191, 90, 242, 0.3); }
        .add-btn { position: fixed; bottom: calc(30px + var(--safe-area-bottom)); right: 25px; width: 60px; height: 60px; background: var(--primary-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        
        canvas { background: white; border-radius: 50%; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        /* 載入動畫 */
        .loading-overlay { position: fixed; inset: 0; background: white; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s; }
    </style>
</head>
<body>

    <div id="loading" class="loading-overlay">
        <img src="./icon.png" width="80" height="80" class="rounded-2xl mb-4 shadow-lg">
        <h2 class="text-xl font-bold text-gray-400">Kuji</h2>
    </div>

    <div class="app-container">
        <div id="home-view" class="view active">
            <div class="ios-navbar rounded-b-xl">
                <div></div>
                <h1>Kuji</h1>
                <button onclick="showView('settings-view')">⚙️</button>
            </div>
            <div id="lottery-list" class="mt-6"></div>
            <div class="add-btn" onclick="startCreate('text')"><span class="text-3xl text-white">+</span></div>
        </div>

        <div id="detail-view" class="view">
            <div class="ios-navbar rounded-b-xl">
                <button onclick="backToHome()">返回</button>
                <h1 id="detail-title">抽獎</h1>
                <button id="detail-clear">重設</button>
            </div>
            <div class="flex-1 flex flex-col items-center justify-center py-6">
                <div class="relative">
                    <canvas id="wheel-canvas" width="300" height="300"></canvas>
                    <div class="absolute -top-4 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[12px] border-l-transparent border-r-[12px] border-r-transparent border-t-[24px] border-t-[var(--primary-color)]"></div>
                </div>
                <button id="spin-btn" class="ios-btn-primary mt-12 w-64">開始抽獎</button>
                <div id="results-list" class="w-full mt-8 ios-list"></div>
            </div>
        </div>

        <div id="settings-view" class="view">
            <div class="ios-navbar">
                <button onclick="backToHome()">完成</button>
                <h1>設定</h1>
                <div></div>
            </div>
            <div class="ios-list mt-6">
                <div class="ios-cell">
                    <span>音效</span>
                    <input type="checkbox" id="sound-toggle" checked style="width:24px;height:24px;">
                </div>
            </div>
        </div>
    </div>

    <script>
        // 音效組件 (使用 Base64 編碼，不需外部檔案)
        const sounds = {
            tick: new Audio("data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YTtvT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19v"),
            win: new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=")
        };

        function playSound(name) {
            if (document.getElementById('sound-toggle').checked) {
                sounds[name].currentTime = 0;
                sounds[name].play().catch(()=>{});
            }
        }

        // 初始化與數據
        let lotteries = JSON.parse(localStorage.getItem('kuji_data')) || [
            { id: 1, title: "午餐吃什麼？", items: ["壽司", "漢堡", "拉麵", "沙律", "茶餐廳"] }
        ];

        function renderHome() {
            const list = document.getElementById('lottery-list');
            list.innerHTML = lotteries.map((l, i) => `
                <div class="ios-list">
                    <div class="ios-cell clickable" onclick="openLottery(${i})">
                        <b>${l.title}</b>
                        <span class="opacity-30">❯</span>
                    </div>
                </div>
            `).join('');
        }

        function showView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function backToHome() { showView('home-view'); renderHome(); }

        let currentPool = [], canvas, ctx;

        function openLottery(idx) {
            const l = lotteries[idx];
            currentPool = [...l.items];
            document.getElementById('detail-title').innerText = l.title;
            document.getElementById('results-list').innerHTML = '';
            showView('detail-view');
            initWheel();
        }

        function initWheel() {
            canvas = document.getElementById('wheel-canvas');
            ctx = canvas.getContext('2d');
            drawWheel(0);
        }

        function drawWheel(rot) {
            const num = currentPool.length;
            const arc = (Math.PI * 2) / num;
            ctx.clearRect(0,0,300,300);
            ctx.save();
            ctx.translate(150,150);
            ctx.rotate(rot);
            for(let i=0; i<num; i++) {
                ctx.beginPath();
                ctx.moveTo(0,0);
                ctx.arc(0,0,140,i*arc,(i+1)*arc);
                ctx.fillStyle = i % 2 == 0 ? '#FFFFFF' : '#F2F2F7';
                ctx.fill();
                ctx.save();
                ctx.rotate(i*arc + arc/2);
                ctx.fillStyle = '#333';
                ctx.font = 'bold 14px sans-serif';
                ctx.fillText(currentPool[i].substring(0,6), 60, 5);
                ctx.restore();
            }
            ctx.restore();
        }

        document.getElementById('spin-btn').onclick = () => {
            let rotation = 0;
            let speed = 0.2 + Math.random() * 0.3;
            const friction = 0.98;
            
            function animate() {
                speed *= friction;
                rotation += speed;
                drawWheel(rotation);
                
                // 模擬刻度音效
                if (speed > 0.02) {
                    if (Math.floor(rotation * 10) % 2 === 0) playSound('tick');
                    requestAnimationFrame(animate);
                } else {
                    // 結束
                    playSound('win');
                    const finalIdx = Math.floor(((2 * Math.PI - (rotation % (2 * Math.PI))) / (2 * Math.PI)) * currentPool.length);
                    const resDiv = document.createElement('div');
                    resDiv.className = 'ios-cell font-bold text-purple-600 text-xl justify-center';
                    resDiv.innerText = `結果：${currentPool[finalIdx]}`;
                    document.getElementById('results-list').prepend(resDiv);
                }
            }
            animate();
        };

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => document.getElementById('loading').remove(), 500);
            }, 1000);
            renderHome();
        };
    </script>
</body>
</html>
