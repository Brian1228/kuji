<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kuji">
    <link rel="apple-touch-icon" href="./icon.png">
    
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Kuji%22,%22short_name%22:%22Kuji%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23F2F2F7%22,%22theme_color%22:%22%23BF5AF2%22,%22icons%22:[{%22src%22:%22./icon.png%22,%22sizes%22:%22192x192%22,%22type%22:%22image/png%22},{%22src%22:%22./icon.png%22,%22sizes%22:%22512x512%22,%22type%22:%22image/png%22}]}">

    <title>Kuji</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary-color: #BF5AF2;
            --bg-color: rgba(191, 90, 242, 0.1);
            --cell-bg-color: rgba(255, 255, 255, 0.85);
            --text-color: #000000;
            --border-color: rgba(0, 0, 0, 0.05);
            --radius-main: 22px; /* 更細膩的 VA 圓角 */
            --radius-cell: 14px;
        }

        /* Webview 生命週期優化：防止過度捲動 */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            -webkit-font-smoothing: antialiased;
            overflow: hidden; 
            overscroll-behavior-y: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .app-container {
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .view {
            display: none;
            flex: 1;
            flex-direction: column;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 20px;
            padding-top: calc(20px + env(safe-area-inset-top, 0px));
            padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px));
            animation: viewAppear 0.25s ease-out;
        }
        @keyframes viewAppear { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        .view.active { display: flex; }

        /* 導航欄與 VA 陰影 */
        .ios-navbar {
            position: sticky;
            top: 0;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: var(--primary-color);
            color: white;
            z-index: 100;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-top: env(safe-area-inset-top, 0px);
            border-radius: 0 0 var(--radius-main) var(--radius-main);
        }

        .navbar-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* 列表組件細節 */
        .ios-list { margin-bottom: 24px; border-radius: var(--radius-main); overflow: hidden; border: 1px solid var(--border-color); box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .ios-cell { 
            background-color: var(--cell-bg-color); 
            backdrop-filter: saturate(180%) blur(20px); 
            padding: 18px 20px; 
            border-bottom: 0.5px solid var(--border-color); 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
        }
        .ios-cell.clickable:active { background-color: rgba(0,0,0,0.1); transform: scale(0.97); transition: 0.1s; }

        /* 旋轉木馬與縮放動畫 */
        #wheel-canvas {
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: white;
            border-radius: 50%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }
        .spinning #wheel-canvas { transform: scale(1.08); }

        .ios-btn-primary { 
            background: linear-gradient(135deg, var(--primary-color), #A349D6);
            color: white; font-size: 18px; font-weight: 700; padding: 18px; 
            border-radius: 20px; text-align: center; width: 100%; 
            box-shadow: 0 10px 25px rgba(191, 90, 242, 0.35);
            transition: all 0.2s;
        }
        .ios-btn-primary:active { transform: scale(0.95); opacity: 0.9; }

        .add-btn { 
            position: fixed; bottom: calc(35px + env(safe-area-inset-bottom, 0px)); right: 25px; 
            width: 72px; height: 72px; background-color: var(--primary-color); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 12px 30px rgba(0,0,0,0.25); z-index: 250;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .add-btn:active { transform: scale(0.8); }

        /* 模態彈窗優化 */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: flex-end; z-index: 400; }
        .modal-overlay.active { display: flex; }
        .modal-sheet { background: #F2F2F7; border-radius: 30px 30px 0 0; width: 100%; overflow: hidden; padding-bottom: env(safe-area-inset-bottom, 20px); }
        .sheet-btn { padding: 22px; font-size: 19px; color: var(--primary-color); text-align: center; background: white; border-bottom: 0.5px solid #E5E5EA; }
        .sheet-btn:active { background: #E5E5EA; }

        .theme-circle { width: 42px; height: 42px; border-radius: 50%; border: 4px solid white; cursor: pointer; transition: 0.3s; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .theme-circle.active { transform: scale(1.25); border-color: #000; box-shadow: 0 8px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="app-container">

        <div id="home-view" class="view active">
            <div class="ios-navbar">
                <div class="w-10"></div> <h1 class="navbar-title" data-i18n="home_title">Kuji</h1>
                <button class="navbar-btn" onclick="safeHaptic('light'); showView('settings-view')" data-i18n="settings">設定</button>
            </div>
            <div id="lottery-list" class="mt-8 space-y-4"></div>
            <div class="add-btn" onclick="handlePlusClick()">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </div>
        </div>

        <div id="create-number-view" class="view">
            <div class="ios-navbar">
                <button class="navbar-btn" onclick="backToHome()" data-i18n="cancel">取消</button>
                <h1 class="navbar-title" data-i18n="num_lottery">數字抽獎</h1>
                <button class="navbar-btn font-bold" onclick="saveLottery('number')" data-i18n="save">儲存</button>
            </div>
            <div class="mt-8 px-1">
                <input id="num-title" type="text" class="ios-input bg-white/90 p-5 rounded-2xl w-full mb-6 shadow-sm outline-none" data-i18n-placeholder="lottery_name_placeholder">
                <span class="ios-label ml-4 mb-2 block opacity-50 font-bold" data-i18n="range_label">設定數字區間</span>
                <div class="ios-list" id="ranges-container"></div>
                <button onclick="safeHaptic('light'); addRangeRow()" class="ios-btn-secondary w-full py-2 opacity-70" data-i18n="add_range">+ 新增區間</button>
                <span class="ios-label ml-4 mt-8 mb-2 block opacity-50 font-bold" data-i18n="rule_label">規則</span>
                <div class="ios-list">
                    <div class="ios-cell">
                        <span data-i18n="unique_label">不重複抽取</span>
                        <input type="checkbox" id="num-unique" checked class="w-6 h-6 accent-purple-500">
                    </div>
                    <div class="ios-cell">
                        <span data-i18n="count_label">一次抽取數目</span>
                        <input type="number" id="num-count" value="1" min="1" class="text-right w-16 bg-transparent font-bold">
                    </div>
                </div>
            </div>
        </div>

        <div id="create-text-view" class="view">
            <div class="ios-navbar">
                <button class="navbar-btn" onclick="backToHome()" data-i18n="cancel">取消</button>
                <h1 class="navbar-title" data-i18n="text_lottery">文字抽獎</h1>
                <button class="navbar-btn font-bold" onclick="saveLottery('text')" data-i18n="save">儲存</button>
            </div>
            <div class="mt-8 px-1">
                <input id="text-title" type="text" class="ios-input bg-white/90 p-5 rounded-2xl w-full mb-6 shadow-sm outline-none" data-i18n-placeholder="lottery_name_placeholder">
                <span class="ios-label ml-4 mb-2 block opacity-50 font-bold" data-i18n="option_label">新增選項</span>
                <div class="ios-list" id="text-items-container"></div>
                <button onclick="safeHaptic('light'); addTextRow()" class="ios-btn-secondary w-full py-2 opacity-70" data-i18n="add_option">+ 新增選項</button>
                <span class="ios-label ml-4 mt-8 mb-2 block opacity-50 font-bold" data-i18n="rule_label">規則</span>
                <div class="ios-list">
                    <div class="ios-cell">
                        <span data-i18n="unique_label">不重複抽取</span>
                        <input type="checkbox" id="text-unique" checked class="w-6 h-6 accent-purple-500">
                    </div>
                    <div class="ios-cell">
                        <span data-i18n="count_label">一次抽取數目</span>
                        <input type="number" id="text-count" value="1" min="1" class="text-right w-16 bg-transparent font-bold">
                    </div>
                </div>
            </div>
        </div>

        <div id="detail-view" class="view items-center">
            <div class="ios-navbar w-full">
                <button class="navbar-btn" onclick="backToHome()" data-i18n="back">返回</button>
                <h1 class="navbar-title" id="detail-title">抽獎</h1>
                <button class="navbar-btn text-red-200" id="detail-clear" data-i18n="reset">重設</button>
            </div>
            <div class="flex-1 w-full flex flex-col items-center justify-center py-6">
                <div id="pool-info" class="text-[10px] font-black mb-6 opacity-30 font-mono tracking-widest bg-black/5 px-4 py-1.5 rounded-full uppercase"></div>
                <div class="relative" id="wheel-wrapper">
                    <canvas id="wheel-canvas" width="300" height="300"></canvas>
                    <div class="absolute -top-5 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[14px] border-l-transparent border-r-[14px] border-r-transparent border-t-[28px] border-t-[var(--primary-color)] z-10 filter drop-shadow-lg"></div>
                </div>
                <div class="w-full max-w-xs space-y-5 mt-14 px-4">
                    <button id="spin-btn" class="ios-btn-primary">開始抽獎</button>
                    <button id="draw-all-btn" class="ios-btn-secondary border-2 border-[var(--primary-color)] rounded-2xl w-full bg-white/60 py-4 font-black text-sm uppercase tracking-widest" data-i18n="draw_all">一次過抽</button>
                </div>
                <div class="w-full mt-12 px-2">
                    <span class="ios-label ml-4 mb-2 block opacity-50 font-bold" data-i18n="results_label">中獎名單</span>
                    <div class="ios-list" id="results-list"></div>
                </div>
            </div>
        </div>

        <div id="settings-view" class="view">
            <div class="ios-navbar">
                <div class="w-10"></div>
                <h1 class="navbar-title" data-i18n="settings">設定</h1>
                <button class="navbar-btn font-bold" onclick="backToHome()" data-i18n="done">完成</button>
            </div>
            <div class="mt-10">
                <span class="ios-label ml-4 mb-2 block opacity-50 font-bold" data-i18n="language_label">語言設定</span>
                <div class="ios-list">
                    <div class="ios-cell">
                        <span data-i18n="select_lang">選擇語言</span>
                        <select id="lang-select" class="ios-select bg-transparent font-black text-purple-600 outline-none" onchange="changeLanguage(this.value)">
                            <option value="zh">繁體中文</option>
                            <option value="en">English</option>
                            <option value="ja">日本語</option>
                            <option value="es">Español</option>
                            <option value="pt">Português</option>
                        </select>
                    </div>
                </div>
                <span class="ios-label ml-4 mt-8 mb-2 block opacity-50 font-bold" data-i18n="theme_label">主題顏色</span>
                <div class="ios-list">
                    <div class="ios-cell">
                        <span data-i18n="theme_select">選擇主題</span>
                        <div class="flex gap-4 justify-end py-1" id="theme-picker"></div>
                    </div>
                </div>
                <div class="text-center opacity-20 text-[9px] mt-16 font-mono uppercase tracking-[0.3em]">Kuji Mobile Engine | Final Stable v2.6.2</div>
            </div>
        </div>
    </div>

    <div id="create-modal" class="modal-overlay" onclick="closeCreateOptions(event)">
        <div class="modal-sheet">
            <div class="sheet-btn rounded-t-xl font-bold" onclick="safeHaptic('light'); startCreate('number')" data-i18n="num_lottery_btn">🔢 數字抽獎</div>
            <div class="sheet-btn font-bold" onclick="safeHaptic('light'); startCreate('text')" data-i18n="text_lottery_btn">📝 文字抽獎</div>
            <div class="sheet-btn cancel text-red-500 font-black" onclick="safeHaptic('medium'); closeCreateOptions()" data-i18n="cancel">取消</div>
        </div>
    </div>

    <script>
        // 安全震動調用，防止報錯中斷邏輯
        function safeHaptic(type) {
            try {
                if (window.navigator && window.navigator.vibrate) {
                    switch(type) {
                        case 'light': window.navigator.vibrate(15); break;
                        case 'medium': window.navigator.vibrate(35); break;
                        case 'success': window.navigator.vibrate([20, 40, 20]); break;
                    }
                }
            } catch(e) { console.log("Haptic not supported"); }
        }

        // 解決「點擊無反應」的顯式處理器
        function handlePlusClick() {
            safeHaptic('medium');
            const modal = document.getElementById('create-modal');
            if (modal) {
                modal.classList.add('active');
            } else {
                console.error("Modal not found!");
            }
        }

        const sounds = {
            tick: new Audio("data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YTtvT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19vT19v"),
            win: new Audio("data:audio/wav;base64,UklGRjIAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YREAAACAgICAgICAgICAgICAgICAgICA")
        };
        function playSnd(n) { sounds[n].currentTime=0; sounds[n].play().catch(()=>{}); }

        const i18n = {
            zh: { home_title: "Kuji 抽獎", settings: "設定", cancel: "取消", save: "儲存", back: "返回", num_lottery: "數字抽獎", text_lottery: "文字抽獎", lottery_name_placeholder: "抽獎名稱...", range_label: "數字區間", add_range: "+ 新增區間", rule_label: "規則", unique_label: "不重複抽取", count_label: "抽取數目", option_label: "抽獎選項", add_option: "+ 新增選項", reset: "重設", start_draw: "開始抽獎", draw_all: "一次過抽", results_label: "中獎名單", theme_label: "主題顏色", theme_select: "選擇主題", done: "完成", num_lottery_btn: "🔢 數字抽獎", text_lottery_btn: "📝 文字抽獎", language_label: "語言設定", select_lang: "選擇語言", delete_confirm: "確定刪除此抽獎？", empty: "目前空空如也，點擊 + 開始" },
            en: { home_title: "Kuji Draw", settings: "Settings", cancel: "Cancel", save: "Save", back: "Back", num_lottery: "Numbers", text_lottery: "Text List", lottery_name_placeholder: "Enter name...", range_label: "Number Ranges", add_range: "+ Add Range", rule_label: "Rules", unique_label: "No Repeat", count_label: "Count", option_label: "Options", add_option: "+ Add Option", reset: "Reset", start_draw: "Spin", draw_all: "Draw All", results_label: "Winners", theme_label: "Appearance", theme_select: "Select Color", done: "Done", num_lottery_btn: "🔢 Numbers", text_lottery_btn: "📝 Text List", language_label: "Language", select_lang: "Select", delete_confirm: "Delete this lottery?", empty: "Tap + to create" },
            ja: { home_title: "クジ", settings: "設定", cancel: "取消", save: "保存", back: "戻る", num_lottery: "数字抽選", text_lottery: "文字抽選", lottery_name_placeholder: "名前を入力...", range_label: "範囲", add_range: "+ 追加", rule_label: "ルール", unique_label: "重複なし", count_label: "回数", option_label: "オプション", add_option: "+ 追加", reset: "リセット", start_draw: "スタート", draw_all: "一括", results_label: "結果", theme_label: "カラー", theme_select: "選択", done: "完了", num_lottery_btn: "🔢 数字", text_lottery_btn: "📝 文字", language_label: "言語", select_lang: "選択", delete_confirm: "削除？", empty: "＋で作成" },
            es: { home_title: "Kuji", settings: "Ajustes", cancel: "Cancelar", save: "Guardar", back: "Volver", num_lottery: "Números", text_lottery: "Texto", lottery_name_placeholder: "Nombre...", range_label: "Rangos", add_range: "+ Añadir", rule_label: "Reglas", unique_label: "Sin repetir", count_label: "Cantidad", option_label: "Opciones", add_option: "+ Añadir", reset: "Reiniciar", start_draw: "Girar", draw_all: "Todo", results_label: "Ganadores", theme_label: "Color", theme_select: "Elegir", done: "Listo", num_lottery_btn: "🔢 Números", text_lottery_btn: "📝 Texto", language_label: "Idioma", select_lang: "Elegir", delete_confirm: "¿Eliminar?", empty: "Pulsa + para crear" },
            pt: { home_title: "Kuji", settings: "Ajustes", cancel: "Cancelar", save: "Salvar", back: "Volver", num_lottery: "Números", text_lottery: "Texto", lottery_name_placeholder: "Nome...", range_label: "Intervalos", add_range: "+ Adicionar", rule_label: "Regras", unique_label: "Sem repetir", count_label: "Qtd", option_label: "Opções", add_option: "+ Adicionar", reset: "Resetar", start_draw: "Sortear", draw_all: "Tudo", results_label: "Ganhadores", theme_label: "Cor", theme_select: "Elegir", done: "Pronto", num_lottery_btn: "🔢 Números", text_lottery_btn: "📝 Texto", language_label: "Idioma", select_lang: "Escolher", delete_confirm: "Excluir?", empty: "Toque + para criar" }
        };

        let currentLang = localStorage.getItem('lang') || 'zh';
        let lotteries = JSON.parse(localStorage.getItem('lotteries')) || [];
        let currentTheme = localStorage.getItem('theme') || '#BF5AF2';
        const themes = ['#007AFF', '#32D74B', '#FF9F0A', '#BF5AF2', '#FF375F', '#5AC8FA', '#000000'];

        function updateUI() {
            const t = i18n[currentLang];
            document.querySelectorAll('[data-i18n]').forEach(el => el.innerText = t[el.getAttribute('data-i18n')] || el.innerText);
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => el.placeholder = t[el.getAttribute('data-i18n-placeholder')]);
            renderHome();
        }

        function changeLanguage(lang) { safeHaptic('light'); currentLang = lang; localStorage.setItem('lang', lang); updateUI(); }

        function updateThemeColors(color) {
            currentTheme = color; localStorage.setItem('theme', color);
            document.documentElement.style.setProperty('--primary-color', color);
            const r = parseInt(color.slice(1,3), 16), g = parseInt(color.slice(3,5), 16), b = parseInt(color.slice(5,7), 16);
            document.documentElement.style.setProperty('--bg-color', `rgba(${r}, ${g}, ${b}, 0.1)`);
            initThemePicker();
        }

        function initThemePicker() {
            const picker = document.getElementById('theme-picker');
            picker.innerHTML = themes.map(t => `<div class="theme-circle ${t === currentTheme ? 'active' : ''}" style="background:${t}" onclick="safeHaptic('light'); updateThemeColors('${t}')"></div>`).join('');
        }

        function showView(id) { 
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active')); 
            document.getElementById(id).classList.add('active'); 
            if(id === 'home-view') renderHome(); 
        }
        function backToHome() { safeHaptic('light'); showView('home-view'); }
        function closeCreateOptions(e) { if(!e || e.target.id === 'create-modal' || e.target.classList.contains('cancel')) document.getElementById('create-modal').classList.remove('active'); }

        function startCreate(type) {
            closeCreateOptions();
            if(type === 'number') { 
                showView('create-number-view'); 
                document.getElementById('num-title').value = '';
                document.getElementById('ranges-container').innerHTML = ''; 
                addRangeRow(); 
            } else { 
                showView('create-text-view'); 
                document.getElementById('text-title').value = '';
                document.getElementById('text-items-container').innerHTML = ''; 
                addTextRow(); 
            }
        }

        function addRangeRow() {
            const div = document.createElement('div');
            div.className = 'ios-cell';
            div.innerHTML = `<input type="number" placeholder="Min" class="w-20 bg-transparent range-min outline-none font-bold"> <span class="opacity-20 text-xs">至</span> <input type="number" placeholder="Max" class="w-20 bg-transparent text-right range-max outline-none font-bold"> <div class="text-red-500 font-black ml-4 px-2" onclick="safeHaptic('medium'); this.parentElement.remove()">×</div>`;
            document.getElementById('ranges-container').appendChild(div);
        }

        function addTextRow() {
            const div = document.createElement('div');
            div.className = 'ios-cell';
            div.innerHTML = `<input type="text" placeholder="..." class="flex-1 bg-transparent text-item-value outline-none"> <div class="text-red-500 font-black ml-4 px-2" onclick="safeHaptic('medium'); this.parentElement.remove()">×</div>`;
            document.getElementById('text-items-container').appendChild(div);
        }

        function saveLottery(type) {
            safeHaptic('success');
            const title = document.getElementById(type === 'number' ? 'num-title' : 'text-title').value.trim() || 'Untitled';
            const unique = document.getElementById(type === 'number' ? 'num-unique' : 'text-unique').checked;
            const count = parseInt(document.getElementById(type === 'number' ? 'num-count' : 'text-count').value) || 1;
            const l = { id: Date.now(), title, type, unique, drawCount: count };
            if(type === 'number') {
                l.ranges = [];
                document.querySelectorAll('.range-min').forEach((m, i) => {
                    const max = document.querySelectorAll('.range-max')[i].value;
                    if(m.value && max) l.ranges.push({ min: parseInt(m.value), max: parseInt(max) });
                });
            } else {
                l.items = [];
                document.querySelectorAll('.text-item-value').forEach(el => { if(el.value) l.items.push(el.value); });
            }
            if((l.ranges && l.ranges.length) || (l.items && l.items.length)) {
                lotteries.unshift(l); localStorage.setItem('lotteries', JSON.stringify(lotteries)); backToHome();
            }
        }

        function renderHome() {
            const list = document.getElementById('lottery-list');
            list.innerHTML = lotteries.length === 0 ? `<div class="py-24 text-center opacity-20 font-bold text-sm tracking-widest" data-i18n="empty">${i18n[currentLang].empty}</div>` : 
                lotteries.map((l, i) => `<div class="ios-list"><div class="ios-cell clickable" onclick="safeHaptic('light'); openLottery(${i})">
                    <div class="flex-1 pr-4"><b>${l.title}</b><div class="text-[9px] opacity-40 uppercase mt-1 font-black tracking-widest">${l.type} · ${l.drawCount}x · ${l.unique?'NoRepeat':'Repeat'}</div></div>
                    <div class="text-red-400 text-2xl font-light px-2" onclick="event.stopPropagation(); deleteLottery(${i})">×</div>
                </div></div>`).join('');
        }

        function deleteLottery(i) { 
            safeHaptic('medium');
            if(confirm(i18n[currentLang].delete_confirm)) { lotteries.splice(i, 1); localStorage.setItem('lotteries', JSON.stringify(lotteries)); renderHome(); } 
        }

        let currentPool = [], drawingResults = [], canvas, ctx, currentLottery;

        function openLottery(i) {
            currentLottery = lotteries[i];
            showView('detail-view');
            document.getElementById('detail-title').innerText = currentLottery.title;
            resetDrawing();
            document.getElementById('spin-btn').onclick = spinWheel;
            document.getElementById('draw-all-btn').onclick = drawAll;
            document.getElementById('detail-clear').onclick = resetDrawing;
        }

        function resetDrawing() {
            safeHaptic('medium');
            currentPool = []; drawingResults = [];
            if(currentLottery.type === 'number') {
                currentLottery.ranges.forEach(r => { for(let i=Math.min(r.min,r.max); i<=Math.max(r.min,r.max); i++) currentPool.push(i.toString()); });
            } else { currentPool = [...currentLottery.items]; }
            document.getElementById('pool-info').innerText = `Pool: ${currentPool.length}`;
            document.getElementById('results-list').innerHTML = '';
            initWheel(currentPool.slice(0, 12));
        }

        function initWheel(items) {
            canvas = document.getElementById('wheel-canvas'); ctx = canvas.getContext('2d');
            window.wheelItems = items.length ? items : ["Empty"]; drawWheel(0);
        }

        function drawWheel(rot) {
            const items = window.wheelItems, num = items.length || 1, arc = (Math.PI*2)/num;
            ctx.clearRect(0,0,300,300); ctx.save(); ctx.translate(150,150); ctx.rotate(rot);
            for(let i=0; i<num; i++){
                ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,140,i*arc,(i+1)*arc);
                ctx.fillStyle = i%2==0?'#FFFFFF':'#F9F9FB'; ctx.fill(); 
                ctx.strokeStyle='rgba(0,0,0,0.04)'; ctx.stroke();
                ctx.save(); ctx.rotate(i*arc+arc/2); ctx.fillStyle='#1C1C1E'; ctx.font='900 13px -apple-system'; ctx.textAlign='right'; ctx.fillText(items[i].toString().substring(0,12), 125, 5); ctx.restore();
            }
            ctx.restore();
        }

        function spinWheel() {
            if(!currentPool.length) { safeHaptic('success'); return; }
            safeHaptic('light');
            document.getElementById('wheel-wrapper').classList.add('spinning');
            const start = Date.now(), dur = 2800;
            const winnerIdx = Math.floor(Math.random()*currentPool.length);
            const winner = currentPool[winnerIdx];
            let lastTick = 0;

            function anim() {
                const p = (Date.now()-start)/dur;
                if(p>=1) { 
                    document.getElementById('wheel-wrapper').classList.remove('spinning');
                    safeHaptic('success'); playSnd('win'); 
                    return handleResult(winner, winnerIdx); 
                }
                const easeOut = 1 - Math.pow(1 - p, 4);
                const currentRot = easeOut * Math.PI * 28;
                if(Math.floor(currentRot * 7) > lastTick) { safeHaptic('light'); playSnd('tick'); lastTick = Math.floor(currentRot * 7); }
                drawWheel(currentRot); requestAnimationFrame(anim);
            }
            anim();
        }

        function drawAll() {
            if(!currentPool.length) return;
            safeHaptic('success');
            const count = Math.min(currentLottery.drawCount, currentPool.length);
            for(let i=0; i<count; i++) { 
                const idx = Math.floor(Math.random()*currentPool.length); 
                handleResult(currentPool[idx], idx); 
            }
            playSnd('win');
        }

        function handleResult(res, idx) {
            drawingResults.push(res);
            if(currentLottery.unique) currentPool.splice(idx, 1);
            const div = document.createElement('div');
            div.className = 'ios-cell animate-pulse'; 
            div.innerHTML = `<span class="text-2xl font-black italic" style="color:var(--primary-color)">${res}</span><span class="text-[9px] opacity-20 font-mono">#${drawingResults.length}</span>`;
            document.getElementById('results-list').prepend(div);
            document.getElementById('pool-info').innerText = `Pool: ${currentPool.length}`;
            setTimeout(() => div.classList.remove('animate-pulse'), 800);
        }

        window.onload = () => { 
            updateThemeColors(currentTheme); 
            updateUI(); 
            // 禁止 iOS 橡皮筋回彈與雙擊
            document.addEventListener('touchstart', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
        };
    </script>
</body>
</html>
